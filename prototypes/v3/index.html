<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BridgeCare · Care coordination</title>
  <meta name="theme-color" content="#261d55">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">BC</span><span>BridgeCare<small>Care coordination</small></span></div>
      <div class="side-section">WORKSPACE</div>
      <div class="nav-stack">
        <button class="nav active" data-view="dashboard"><span class="nav-icon">▦</span> Dashboard <b id="nav-alert-count"></b></button>
        <button class="nav" data-view="case"><span class="nav-icon">◇</span> <span id="case-nav-label">Sarah’s case</span></button>
        <button class="nav" data-view="patient"><span class="nav-icon">▣</span> Patient preview</button>
      </div>
      <div class="sidebar-bottom">
        <div class="demo-note"><span class="demo-kicker">DEMO MODE</span><strong>One referral. Every handoff.</strong><br>Hospital calls and patient updates are simulated.</div>
        <button class="reset" data-action="reset">↺ Reset demo</button>
        <div class="user"><span class="avatar">YD</span><span>Yuzhu Dai<small>Care coordinator</small></span></div>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar"><div class="crumb"><span class="crumb-mark">BC</span>Coordinator workspace <span class="crumb-slash">/</span> <strong id="current-view-label">Dashboard</strong></div><div class="top-right"><span class="mock-tag"><i></i> INTERACTIVE MOCK</span><button class="reset-mini" data-action="reset">Reset</button><span class="header-avatar">YD</span></div></header>
      <main id="app" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
